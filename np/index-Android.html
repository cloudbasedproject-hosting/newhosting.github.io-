<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        /* Contenedor del Simulador Físico */
        .phone-frame {
            width: 380px;
            height: 780px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 4px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Cámara / Notch */
        .phone-notch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background: #000;
            border-radius: 15px;
            z-index: 100;
        }

        /* Pantalla Interna */
        .phone-screen {
            flex: 1;
            background-image: url('https://cloudbasedproject-hosting.github.io/newhosting.github.io-/np/fondo-Android.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de Estado superior */
        .status-bar {
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 12px;
            font-weight: 500;
            z-index: 10;
        }

        .status-icons span {
            margin-left: 5px;
        }

        /* Espacio principal del Sistema */
        .os-container {
            flex: 1;
            position: relative;
        }

        /* Vista de Escritorio (Launcher) */
        .launcher-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            padding-bottom: 40px;
        }

        /* Cuadrícula de Apps */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .app-icon:hover {
            transform: scale(1.08);
        }

        .icon-shape {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 6px;
        }

        .app-label {
            font-size: 11px;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Colores específicos de marcas para iconos nativos/simulados */
        .bg-facebook { background: #1877F2; color: white; }
        .bg-whatsapp { background: #25D366; color: white; }
        .bg-messenger { background: linear-gradient(45deg, #006FFF, #00E1FF, #FF7B00); color: white; }
        .bg-browser { background: #ffffff; color: #4285F4; }
        .bg-custom { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.3); }

        /* Barra de herramientas / Dock inferior */
        .app-dock {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Navegador Interno Integrado */
        .browser-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        .browser-view.active {
            transform: translateY(0);
        }

        .browser-header {
            background: #f1f3f4;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #dadce0;
            color: #333;
        }

        .browser-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
        }

        .browser-url-bar {
            flex: 1;
            background: #fff;
            border: 1px solid #chchch;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .browser-content {
            flex: 1;
            position: relative;
            background: #f8f9fa;
        }

        .browser-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Alerta de bloqueo de Iframe */
        .iframe-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 30px 20px;
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 55;
        }

        .fallback-btn {
            margin-top: 20px;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        /* Formulario para añadir nuevas URLs */
        .add-url-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 60;
        }

        .add-url-panel.active {
            transform: translateY(0);
        }

        .panel-title {
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 13px;
        }

        .panel-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary { background: #25D366; color: white; }
        .btn-secondary { background: #444; color: white; }

        /* Barra de navegación inferior de Android */
        .navigation-bar {
            height: 42px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 70;
        }

        .nav-button {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0.7;
        }

        .nav-button:hover { opacity: 1; }
        .nav-back { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 10px solid white; }
        .nav-home { width: 12px; height: 12px; background: white; border-radius: 50%; }
        .nav-recent { width: 11px; height: 11px; border: 2px solid white; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>
        
        <div class="phone-screen">
            <!-- Barra de estado -->
            <div class="status-bar">
                <div class="status-time" id="clock">22:00</div>
                <div class="status-icons">
                    <span>📶</span>
                    <span>🔋 85%</span>
                </div>
            </div>

            <!-- Espacio Principal -->
            <div class="os-container">
                
                <!-- Launcher de Aplicaciones -->
                <div class="launcher-view" id="launcher">
                    <div class="apps-grid" id="appsContainer">
                        <!-- Facebook -->
                        <div class="app-icon" onclick="openApp('Facebook', 'https://www.facebook.com')">
                            <div class="icon-shape bg-facebook">f</div>
                            <div class="app-label">Facebook</div>
                        </div>
                        <!-- WhatsApp -->
                        <div class="app-icon" onclick="openApp('WhatsApp', 'https://web.whatsapp.com')">
                            <div class="icon-shape bg-whatsapp">Web</div>
                        </div>
                        <!-- Messenger -->
                        <div class="app-icon" onclick="openApp('Messenger', 'https://www.messenger.com')">
                            <div class="icon-shape bg-messenger">~</div>
                            <div class="app-label">Messenger</div>
                        </div>
						 <!-- RADIO -->
                        <div class="app-icon" onclick="openApp('RADIO', 'https://siradiomixer.es.tl/')">
                            <div class="icon-shape bg-messenger">🎼</div>
                            <div class="app-label">RADIO</div>
                        </div>
                    </div>

                    <!-- Dock Inferior -->
                    <div class="app-dock">
                        <div class="app-icon" onclick="openApp('Navegador', 'https://www.google.com?igu=1')">
                            <div class="icon-shape bg-browser">🌐</div>
                            <div class="app-label">Internet</div>
                        </div>
                        <div class="app-icon" onclick="toggleAddPanel(true)">
                            <div class="icon-shape bg-custom">＋</div>
                            <div class="app-label">Añadir</div>
                        </div>
                    </div>
                </div>

                <!-- Navegador Web Interno -->
                <div class="browser-view" id="browserView">
                    <div class="browser-header">
                        <button class="browser-close" onclick="closeBrowser()">✕</button>
                        <div class="browser-url-bar" id="browserUrlBar">https://...</div>
                    </div>
                    <div class="browser-content">
                        <!-- Contenedor del Iframe -->
                        <iframe id="browserIframe" class="browser-iframe" src=""></iframe>
                        
                        <!-- Pantalla alternativa si el sitio bloquea X-Frame-Options -->
                        <div id="iframeFallback" class="iframe-fallback" style="display: none;">
                            <p style="font-size: 24px; margin-bottom: 10px;">🔒</p>
                            <p style="font-weight: bold; margin-bottom: 8px;">Este sitio no permite visualizarse en un simulador</p>
                            <p style="font-size: 12px; color: #666;">Por políticas de seguridad (X-Frame-Options), debes abrir este enlace en una pestaña externa.</p>
                            <a id="fallbackLink" href="#" target="_blank" class="fallback-btn">Abrir en nueva ventana</a>
                        </div>
                    </div>
                </div>

                <!-- Panel Flotante para Añadir Enlace -->
                <div class="add-url-panel" id="addUrlPanel">
                    <div class="panel-title">Añadir acceso directo web</div>
                    <div class="input-group">
                        <input type="text" id="newAppName" placeholder="Nombre de la app (ej. Blog)">
                    </div>
                    <div class="input-group">
                        <input type="url" id="newAppUrl" placeholder="https://ejemplo.com">
                    </div>
                    <div class="panel-buttons">
                        <button class="btn btn-secondary" onclick="toggleAddPanel(false)">Cancelar</button>
                        <button class="btn btn-primary" onclick="addNewApp()">Añadir</button>
                    </div>
                </div>

            </div>

            <!-- Barra de Navegación Física/Software Android -->
            <div class="navigation-bar">
                <div class="nav-button" onclick="closeBrowser()"><div class="nav-back"></div></div>
                <div class="nav-button" onclick="closeBrowser(); toggleAddPanel(false);"><div class="nav-home"></div></div>
                <div class="nav-button"><div class="nav-recent"></div></div>
            </div>
        </div>
    </div>

    <script>
        // Actualizar reloj simulado
        function updateClock() {
            const now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Lista de URLs conocidas por bloquear incrustación en iFrames
        const iframeBlockers = [
            'facebook.com',
            'whatsapp.com',
            'messenger.com',
			'siradiomixer.es.tl',
            'google.com',
            'instagram.com',
            'youtube.com',
            'twitter.com',
            'x.com'
        ];

        // Abrir app / URL
        function openApp(name, url) {
            const browserView = document.getElementById('browserView');
            const browserUrlBar = document.getElementById('browserUrlBar');
            const browserIframe = document.getElementById('browserIframe');
            const iframeFallback = document.getElementById('iframeFallback');
            const fallbackLink = document.getElementById('fallbackLink');

            browserUrlBar.textContent = url;
            browserView.classList.add('active');

            // Verificar si el dominio suele bloquear iframes
            let blocksIframe = false;
            for (let domain of iframeBlockers) {
                if (url.toLowerCase().includes(domain)) {
                    blocksIframe = true;
                    break;
                }
            }

            if (blocksIframe) {
                // Ocultar iframe y mostrar botón para abrir fuera del simulador
                browserIframe.style.display = 'none';
                browserIframe.src = '';
                fallbackLink.href = url;
                iframeFallback.style.display = 'flex';
            } else {
                // Intentar cargar en iframe de manera normal
                iframeFallback.style.display = 'none';
                browserIframe.style.display = 'block';
                browserIframe.src = url;
            }
        }

        // Cerrar el navegador integrado
        function closeBrowser() {
            const browserView = document.getElementById('browserView');
            const browserIframe = document.getElementById('browserIframe');
            browserView.classList.remove('active');
            browserIframe.src = '';
        }

        // Mostrar/Ocultar panel para añadir URL
        function toggleAddPanel(show) {
            const panel = document.getElementById('addUrlPanel');
            if (show) {
                panel.classList.add('active');
            } else {
                panel.classList.remove('active');
                document.getElementById('newAppName').value = '';
                document.getElementById('newAppUrl').value = '';
            }
        }

        // Añadir una nueva aplicación dinámicamente
        function addNewApp() {
            const name = document.getElementById('newAppName').value.trim();
            let url = document.getElementById('newAppUrl').value.trim();

            if (!name || !url) {
                alert('Por favor, rellena ambos campos.');
                return;
            }

            // Validar protocolo URL
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            const appsContainer = document.getElementById('appsContainer');
            
            // Crear el elemento de la app
            const appDiv = document.createElement('div');
            appDiv.className = 'app-icon';
            
            // Tomar la primera letra para el icono personalizado
            const firstLetter = name.charAt(0).toUpperCase();

            appDiv.innerHTML = `
                <div class="icon-shape bg-custom">${firstLetter}</div>
                <div class="app-label">${name}</div>
            `;
            
            // Evento para abrir al hacer click
            appDiv.onclick = function() {
                openApp(name, url);
            };

            appsContainer.appendChild(appDiv);
            toggleAddPanel(false);
        }
    </script>
</body>
</html>
