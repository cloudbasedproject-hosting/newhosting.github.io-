<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Interactiva con Respaldo Excel</title>
    <!-- SheetJS para exportar a Excel -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #f5f5f5;
            --btn-bg: #007bff;
            --btn-text: #ffffff;
            --accent-color: #28a745;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --card-bg: #1e1e1e;
            --btn-bg: #375a7f;
            --btn-text: #ffffff;
            --accent-color: #218838;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ccc;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button, .file-label {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover, .file-label:hover {
            opacity: 0.9;
        }

        #excelBtn {
            background-color: var(--accent-color);
        }

        input[type="file"] {
            display: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .gallery-item {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: scale(1.03);
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .gallery-item .info {
            padding: 10px;
            font-size: 12px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Ventana Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 80%;
            max-height: 80%;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(214, 214, 214, 0.3);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h2>Mi Galería Interactiva</h2>
        <div class="controls">
            <label for="imageLoader" class="file-label">➕ Añadir Imagen</label>
            <input type="file" id="imageLoader" accept="image/*" multiple>
            
            <button id="excelBtn">📊 Guardar en Excel</button>
            <button id="themeToggle">🌙 Modo Oscuro</button>
        </div>
    </header>

    <main class="gallery" id="galleryContainer">
        <!-- Las imágenes cargadas aparecerán aquí -->
    </main>

    <!-- Ventana Modal -->
    <div id="imageModal" class="modal">
        <span class="close" id="closeModal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Vista ampliada">
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const galleryContainer = document.getElementById('galleryContainer');
        const themeToggle = document.getElementById('themeToggle');
        const excelBtn = document.getElementById('excelBtn');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');

        // Arreglo en memoria para guardar datos de las imágenes para el Excel
        let imagesData = [];

        // 1. Alternar Modo Oscuro
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙 Modo Oscuro';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️ Modo Claro';
            }
        });

        // 2. Cargar imágenes dinámicamente
        imageLoader.addEventListener('change', (e) => {
            const files = e.target.files;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function(event) {
                    const src = event.target.result;
                    const date = new Date().toLocaleString();

                    // Guardar datos para el Excel
                    imagesData.push({
                        Nombre: file.name,
                        Fecha_Carga: date,
                        Tamaño_KB: (file.size / 1024).toFixed(2),
                        Data_URL: src // Guarda el contenido de la imagen en formato de texto Base64
                    });

                    // Crear elemento en la galería
                    const item = document.createElement('div');
                    item.classList.add('gallery-item');
                    item.innerHTML = `
                        <img src="${src}" alt="${file.name}">
                        <div class="info">${file.name}</div>
                    `;

                    // Evento para abrir en la ventana modal
                    item.addEventListener('click', () => {
                        modal.style.display = "flex";
                        modalImg.src = src;
                    });

                    galleryContainer.appendChild(item);
                }

                reader.readAsDataURL(file);
            }
        });

        // 3. Cerrar Ventana Modal
        closeModal.addEventListener('click', () => {
            modal.style.display = "none";
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });

        // 4. Vincular y Exportar a Excel
        excelBtn.addEventListener('click', () => {
            if (imagesData.length === 0) {
                alert('Por favor, añade primero algunas imágenes a la galería.');
                return;
            }

            // Crear libro y hoja de cálculo de Excel
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(imagesData);

            // Añadir la hoja al libro
            XLSX.utils.book_append_sheet(wb, ws, "Imágenes Guardadas");

            // Descargar el archivo Excel generado
            XLSX.writeFile(wb, "galeria_imagenes.xlsx");
        });
    </script>
</body>
</html>
